name: Commit messages

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  pull-requests: read

jobs:
  commit-messages:
    name: Commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Read metadata only; never check out or execute PR code.
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const pr = context.payload.pull_request;
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              ...context.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            // GitHub's PR commits endpoint returns at most 250 commits.
            if (commits.length !== pr.commits) {
              core.setFailed('Could not check every commit. Split this PR into smaller PRs.');
              return;
            }
            const format = /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^()\r\n]+\))?!?: \S[^\r\n]*$/;
            const invalid = commits.filter(({ commit }) => !format.test(commit.message.split('\n')[0]));
            if (invalid.length) {
              core.setFailed(`Invalid commit messages: ${invalid.map(({ sha }) => sha.slice(0, 7)).join(', ')}. Use type(scope): description; scope is optional. See CONTRIBUTING.md.`);
            }
